server {
    listen 80;
    server_name _;
    root /usr/share/nginx/viewer;
    index index.html;
    add_header Cache-Control "no-cache" always;

    location /clips/ {
        alias /srv/clips/;
        autoindex on;
        autoindex_format json;
        location ~* \.mp4$ { mp4; add_header Cache-Control "public, max-age=3600"; }
    }
    location /thumbs/ {
        alias /srv/thumbs/;
        expires 7d;
    }
}
