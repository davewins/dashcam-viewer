# Dashcam clip viewer: nginx (static page + read-only clip listing) and an ffmpeg loop that makes thumbnails.
# Set CLIPS_DIR (your dashcam folder: YYYY-MM-DD/Normal|Parking|Event/*.MP4) and DATA_DIR (where thumbnails are cached).
# Copy this folder to DATA_DIR's parent or adjust the three file mounts below to point at this repo's files.
services:
  viewer:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${BIND:-0.0.0.0}:${PORT:-8230}:80"
    volumes:
      - ${CLIPS_DIR:?set CLIPS_DIR}:/srv/clips:ro
      - ${DATA_DIR:?set DATA_DIR}/thumbs:/srv/thumbs:ro
      - ./www:/usr/share/nginx/viewer:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  thumbs:
    image: jrottenberg/ffmpeg:6-alpine
    restart: unless-stopped
    network_mode: none
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["/bin/sh", "/thumbs.sh"]
    volumes:
      - ${CLIPS_DIR}:/clips:ro
      - ${DATA_DIR}/thumbs:/thumbs
      - ./thumbs.sh:/thumbs.sh:ro
